<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="Pyramide féodale : hiérarchie du royaume de France"><rect width="660" height="340" fill="#1a1a2e" rx="8"></rect><text x="330" y="24" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Pyramide féodale</text><defs><marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L5,10 L10,0" fill="#b7950b"></path></marker><marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,10 L5,0 L10,10" fill="#6c3483"></path></marker></defs><polygon points="300,40 360,40 410,84 250,84" fill="#1a5276" stroke="#2980b9" stroke-width="1.5"></polygon><text x="330" y="56" fill="#fff" font-size="13" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif" dominant-baseline="middle">Roi</text><text x="330" y="71" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif" dominant-baseline="middle">Suzerain suprême</text><polygon points="250,84 410,84 460,128 200,128" fill="#2471a3" stroke="#2980b9" stroke-width="1.5"></polygon><text x="330" y="100" fill="#fff" font-size="13" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif" dominant-baseline="middle">Grands vassaux</text><text x="330" y="115" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif" dominant-baseline="middle">Ducs, comtes</text><text x="468" y="106" fill="#cbd5e1" font-size="9" text-anchor="start" font-family="system-ui, sans-serif" dominant-baseline="middle">~1 %</text><polygon points="200,128 460,128 510,172 150,172" fill="#2e86c1" stroke="#5dade2" stroke-width="1.5"></polygon><text x="330" y="144" fill="#fff" font-size="13" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif" dominant-baseline="middle">Arrière-vassau